spring.application.name=kibo-reservation-system
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kibo}
spring.datasource.username=${DB_USERNAME:kibo}
spring.datasource.password=${DB_PASSWORD:kibo123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

reservation.hold.duration-minutes=5
reservation.expiry.scan-delay-ms=5000
reservation.outbox.scan-delay-ms=2000
reservation.outbox.batch-size=100
